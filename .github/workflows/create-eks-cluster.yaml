name: eks-cluster

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Cluster name'
        required: true
        default: 'expense-dev'
      delete_cluster:
        description: 'Delete cluster after run?'
        required: true
        default: 'true'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout branch
      - name: Checkout branch
        uses: actions/checkout@v4.2.2  # or latest tag supporting Node 24

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0  # supports Node 24
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Install eksctl
      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      # 4. Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      # 5. Create EKS Cluster with Spot Nodes + Optional Custom AMI
      - name: Create EKS Cluster Inline
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          NODEGROUP_NAME="${CLUSTER_NAME}-nodes"
          REGION="${{ secrets.AWS_REGION }}"

          echo "=== Region: $REGION ==="

          # Get AZs
          AZ_CSV=$(aws ec2 describe-availability-zones \
            --region $REGION \
            --filters "Name=state,Values=available" \
            --query 'AvailabilityZones[].ZoneName' \
            --output text | tr '\t' ',' | sed 's/,$//')
          echo "=== AZ_CSV: [$AZ_CSV] ==="

          # Get instance types available in region
          INSTANCE_TYPES=$(aws ec2 describe-instance-type-offerings \
            --location-type availability-zone \
            --region $REGION \
            --query 'InstanceTypeOfferings[].InstanceType' \
            --output text | tr '\t' '\n' | sort -u)
          echo "=== All available instance types ==="
          echo "$INSTANCE_TYPES"

          # Pick 2 safe ones from the list
          SELECTED=$(echo "$INSTANCE_TYPES" | grep -E '^(t3|t3a|m5|m6i|c5|c6i)\.(medium|large|xlarge)$' | head -2 | tr '\n' ',' | sed 's/,$//')
          echo "=== SELECTED: [$SELECTED] ==="

          # Fail early if nothing found
          if [ -z "$AZ_CSV" ] || [ -z "$SELECTED" ]; then
            echo "ERROR: Could not resolve AZs or instance types. Aborting."
            exit 1
          fi

          eksctl create cluster \
            --name $CLUSTER_NAME \
            --region $REGION \
            --zones $AZ_CSV \
            --version 1.29 \
            --managed \
            --nodegroup-name $NODEGROUP_NAME \
            --node-type $SELECTED \
            --nodes 2 \
            --nodes-min 1 \
            --nodes-max 4 \
            --spot \
            --asg-access \
            --full-ecr-access
            

      # 6. Update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ github.event.inputs.cluster_name }} --region ${{ secrets.AWS_REGION }}

      # 7. Verify nodes
      - name: Verify nodes
        run: |
          kubectl get nodes

      # 8. Delete cluster (optional)
      - name: Delete EKS Cluster
        if: ${{ github.event.inputs.delete_cluster == 'true' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          REGION="${{ secrets.AWS_REGION }}"
          echo "Deleting EKS cluster $CLUSTER_NAME..."
          eksctl delete cluster --name $CLUSTER_NAME --region $REGION