name: Create EKS Cluster

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Cluster name'
        required: true
        default: 'expense-dev'
      region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      k8s_version:
        description: 'Kubernetes Version'
        required: true
        default: '1.34'
      delete_cluster:
        description: 'Delete cluster after run?'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  id-token: write # Required for OIDC (if you switch from keys later)
  contents: read

jobs:
  cluster-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

            - name: Install eksctl (Official Source)
        run: |
          # 1. Define the correct architecture and platform
          # 'uname -s' gives 'Linux', 'uname -m' gives 'x86_64' which we map to 'amd64'
          PLATFORM=$(uname -s)_amd64
          
          # 2. Download from the OFFICIAL eksctl-io repository
          # --fail causes curl to exit with an error on 404 (instead of downloading an HTML error page)
          echo "Downloading eksctl for $PLATFORM..."
          curl --fail --silent --location "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$PLATFORM.tar.gz" -o /tmp/eksctl.tar.gz
          
          # 3. Extract and Install
          tar -xzf /tmp/eksctl.tar.gz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          
          # 4. Verify Installation
          echo "eksctl installed successfully:"
          eksctl version

      - name: Install kubectl
        run: |
          # Downloads the binary matching the specific requested version to avoid skew
          VERSION=$(curl -L -s https://dl.k8s.io)
          curl -LO "https://dl.k8s.io"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Create EKS Cluster (Spot Instances)
        run: |
          eksctl create cluster \
            --name "${{ inputs.cluster_name }}" \
            --region "${{ inputs.region }}" \
            --version "${{ inputs.k8s_version }}" \
            --nodegroup-name "spot-workers" \
            --node-type m5.large,c5.large,m5a.large \
            --nodes 2 \
            --nodes-min 1 \
            --nodes-max 4 \
            --managed \
            --spot \
            --full-ecr-access \
            --asg-access

      - name: Verify Cluster Access
        run: |
          aws eks update-kubeconfig --name ${{ inputs.cluster_name }} --region ${{ inputs.region }}
          kubectl get nodes -o wide

      - name: Delete Cluster (Conditional)
        if: ${{ always() && inputs.delete_cluster == true }}
        run: |
          echo "Deleting cluster: ${{ inputs.cluster_name }}"
          eksctl delete cluster --name ${{ inputs.cluster_name }} --region ${{ inputs.region }} --wait
