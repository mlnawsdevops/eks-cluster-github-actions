name: EKS_Cluster

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Cluster name'
        required: true
        default: 'expense-dev'
      region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      k8s_version:
        description: 'Kubernetes Version'
        required: true
        default: '1.34'
      delete_cluster:
        description: 'Delete cluster after run?'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  id-token: write 
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      # 3. Install eksctl
      - name: Install eksctl
        run: |
          curl --silent --fail --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            -o /tmp/eksctl.tar.gz

          tar -xzf /tmp/eksctl.tar.gz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          rm /tmp/eksctl.tar.gz
          eksctl version


      # 4. Install kubectl
      - name: Install kubectl
        run: |
          # 1. Get the latest stable version string
          K8S_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          
          # 2. Download the binary for Linux amd64
          curl -LO "https://dl.k8s.io/release/${K8S_VERSION}/bin/linux/amd64/kubectl"
          
          # 3. Make executable and move to PATH
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # 4. Verify installation
          kubectl version --client

      # Create EKS Cluster  
      - name: Create EKS Cluster
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          REGION="${{ secrets.AWS_REGION }}"
          CLUSTER_VERSION="${{ github.event.inputs.k8s_version}}"
          
          # Check if cluster is already ACTIVE
          if eksctl get cluster --name "$CLUSTER_NAME" --region "$REGION" > /dev/null 2>&1; then
            echo "Cluster '$CLUSTER_NAME' already exists and is active. Skipping."
          else
            echo "Cluster not found or broken. Cleaning up potential ghost stacks..."
            eksctl delete cluster --name "$CLUSTER_NAME" --region "$REGION" --wait || true
            
            echo "Starting fresh cluster creation..."
            eksctl create cluster \
              --name "$CLUSTER_NAME" \
              --region "$REGION" \
              --version 1.31 \
              --nodegroup-name "${CLUSTER_NAME}-nodes" \
              --managed \
              --instance-types t3.medium,t3.large \
              --nodes 2 \
              --spot \
              --asg-access
          fi

      # Verify Cluster
      - name: Verify Cluster Access
        run: |
          aws eks update-kubeconfig --name ${{ inputs.cluster_name }} --region ${{ inputs.region }}
          eksctl get cluster --region us-east-1
          kubectl get nodes 

      # Delete CLuster
      - name: Delete Cluster
        if: ${{ always() && inputs.delete_cluster == true }}
        run: |
          echo "Deleting cluster: ${{ inputs.cluster_name }}"
          eksctl delete cluster --name ${{ inputs.cluster_name }} --region ${{ inputs.region }} --wait