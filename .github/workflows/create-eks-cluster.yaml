name: eks-cluster

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Cluster name'
        required: true
        default: 'expense-dev'
      delete_cluster:
        description: 'Delete cluster after run?'
        required: true
        default: 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout branch
      - name: Checkout branch
        uses: actions/checkout@v4.2.2

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Install eksctl
      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      # 4. Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      # 5. Create EKS Cluster
      - name: Create EKS Cluster
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          NODEGROUP_NAME="${CLUSTER_NAME}-nodes"
          REGION="${{ secrets.AWS_REGION }}"

          # Resolve AZs
          AZ_CSV=$(aws ec2 describe-availability-zones \
            --region $REGION \
            --filters "Name=state,Values=available" \
            --query 'AvailabilityZones[].ZoneName' \
            --output text | tr '\t' ',' | sed 's/,$//')
          echo "AZs: [$AZ_CSV]"

          # Write eksctl config file
          cat > cluster.yaml <<EOF
          apiVersion: eksctl.io/v1alpha5
          kind: ClusterConfig

          metadata:
            name: ${CLUSTER_NAME}
            region: ${REGION}
            version: "1.32"

          availabilityZones:
          $(echo $AZ_CSV | tr ',' '\n' | sed 's/^/  - /')

          managedNodeGroups:
            - name: ${NODEGROUP_NAME}
              instanceTypes:
                - c5.large
                - c5.xlarge
                - c6a.large
                - c6a.xlarge
              availabilityZones:
          $(echo $AZ_CSV | tr ',' '\n' | sed 's/^/        - /')
              minSize: 1
              maxSize: 4
              desiredCapacity: 2
              spot: true
              labels:
                lifecycle: spot
              iam:
                withAddonPolicies:
                  autoScaler: true
                  imageBuilder: true
          EOF

          echo "=== cluster.yaml ==="
          cat cluster.yaml

          echo "=== Creating cluster ==="
          eksctl create cluster -f cluster.yaml

      # 6. Update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ github.event.inputs.cluster_name }} \
            --region ${{ secrets.AWS_REGION }}

      # 7. Taint spot nodes
      - name: Taint spot nodes
        run: |
          kubectl get nodes -l lifecycle=spot -o name | \
            xargs -I {} kubectl taint nodes {} spot=true:NoSchedule --overwrite

      # 8. Verify nodes
      - name: Verify nodes
        run: |
          kubectl get nodes
          echo "--- Node taints ---"
          kubectl get nodes \